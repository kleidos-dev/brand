version = 1
SPDX-PackageName = "brand"
SPDX-PackageSupplier = "José M. Requena Plens <jmrplens@kleidos.dev>"
SPDX-PackageDownloadLocation = "https://github.com/kleidos-dev/brand"

# The artwork: the mark, the lockups and their PNG files, the palette's sheet,
# the press images, their templates and their words, the screen captures, the
# photographs, and the pages about them. GPL-3.0-or-later, the firmware's
# license.
#
# Three things this file cannot express, all stated in TRADEMARKS.md:
#
# - An additional term under section 7(e) of the GNU GPL version 3, for the
#   whole repository: no license here grants rights under trademark law in
#   the name "Kleidos" or in the Kleidos mark.
# - An additional term under section 7(c), for the files under the GPL: a
#   modified version must be marked in reasonable ways as different from
#   the original, and must not misrepresent the origin of the material.
# - An additional permission under section 7 for the images and texts under
#   logo/, press-kit/ and about/ (the press permission). REUSE has no way to
#   declare a custom exception, so for those paths the identifier below
#   understates what is granted: it is the GPL plus that permission.
[[annotations]]
path = ["**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 José M. Requena Plens <mail@kleidos.dev>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# What is more useful to everyone under the MIT License: the tokens and what
# is generated from them, the tooling (the builders, the checks, their tests,
# the CI, the commit-message gate copied from the agents repository, the
# pins), and the texts that describe the project (about/ and the fact
# sheets), so anyone can reuse and quote them freely.
[[annotations]]
path = [
  "tokens/**",
  "tools/**",
  "tests/**",
  ".github/**",
  "requirements.txt",
  ".pre-commit-config.yaml",
  ".editorconfig",
  ".gitignore",
  ".python-version",
  "about/**",
  "press-kit/en/fact-sheet.md",
  "press-kit/es/fact-sheet.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 José M. Requena Plens <mail@kleidos.dev>"
SPDX-License-Identifier = "MIT"

# The nine board fronts, byte copies of the boards repository's
# <board>/svg/front.svg at the commit boards/boards.json records, under that
# repository's MIT License; the manifest is ours, MIT as well. The products
# they draw, and the marks printed on them, are their makers'.
[[annotations]]
path = ["boards/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 José M. Requena Plens <mail@kleidos.dev>"
SPDX-License-Identifier = "MIT"

# Mona Sans and Mona Sans Mono 2.0.27, unmodified (fonts/VERSIONS.md). The
# copyright line is the one their OFL.txt carries, reserved name included.
[[annotations]]
path = ["fonts/mona-sans/**"]
precedence = "override"
SPDX-FileCopyrightText = "2022 The Mona Sans Project Authors (https://github.com/github/mona-sans), with Reserved Font Name \"Mona\""
SPDX-License-Identifier = "OFL-1.1"

# Inter 4.1, unmodified.
[[annotations]]
path = ["fonts/inter/**"]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

# JetBrains Mono 2.304, unmodified.
[[annotations]]
path = ["fonts/jetbrains-mono/**"]
precedence = "override"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"
