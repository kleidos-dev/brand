#
# The repository's gate on every push and pull request, cheapest first
# (the project's CI convention). The shared checks are the quality kit's,
# called by its name, @v3 (kleidos-dev/.github, docs/quality.md, "How a
# repository runs the kit"): no kit code is held here. What only this
# repository does (the tree's rules and the generated files, brand's and the
# social pack's under social/, the KiCad kit) is a job of its own.
#
#   ⚡ Quick ──────────┬─ 🧪 Check ── 📊 Sonar
#   🧭 Tree rules ─────┴─ 🧫 KiCad kit
#
# Quick: lint (every hook, the kit's policy), licensing, the secrets and MAC
# scan, and on a pull request the commit messages. Check: the tests and the
# pictures (brand's, then the social pack's), mypy (one run per group of
# pyproject.toml), OSV.
#
# The last job, ✅ Check, is the one required check: it needs every other
# job of this file, always runs, and fails unless each succeeded or was
# skipped with leave (MAY_SKIP). The weekly run is for OSV: a new advisory
# against unchanged dependencies turns it red. It skips the KiCad export
# and SonarCloud.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Monday 06:00 Europe/Madrid in winter, with the Dependabot runs.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every hook but brand-check and social-check, which run tools/check.py and
  # social/tools/check.py from the local virtual environment: the tree job
  # below runs both with the pinned stack and the deny-list.
  quick:
    name: "⚡ Quick"
    uses: kleidos-dev/.github/.github/workflows/quick.yml@v3
    with:
      skip: brand-check,social-check
    permissions:
      contents: read

  # The tree's own rules (tools/check.py), the social pack's
  # (social/tools/check.py, which also compares its pictures with their
  # sources and record) and the generated files against their sources, without
  # a browser. The identity patterns of the metadata check's deny-list are
  # private: they come from the KLEIDOS_DENY_EXTRA secret, one pattern per
  # line. A run without it (a fork, Dependabot, or the secret not set yet)
  # checks every other class and warns that identity was not checked.
  tree:
    name: "🧭 Tree rules and generated files"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install the pinned stack
        run: pip install --require-hashes -r requirements.txt
      - name: The tree's rules
        env:
          KLEIDOS_DENY_EXTRA: ${{ secrets.KLEIDOS_DENY_EXTRA }}
          KLEIDOS_DENY_OPTIONAL: ${{ secrets.KLEIDOS_DENY_EXTRA == '' && '1' || '0' }}
        run: python tools/check.py
      - name: Every generated file is what its sources give (no browser)
        env:
          KLEIDOS_DENY_EXTRA: ${{ secrets.KLEIDOS_DENY_EXTRA }}
          KLEIDOS_DENY_OPTIONAL: ${{ secrets.KLEIDOS_DENY_EXTRA == '' && '1' || '0' }}
        run: python tools/build.py --check --static
      - name: The social pack's rules and pictures (no browser)
        env:
          KLEIDOS_DENY_EXTRA: ${{ secrets.KLEIDOS_DENY_EXTRA }}
          KLEIDOS_DENY_OPTIONAL: ${{ secrets.KLEIDOS_DENY_EXTRA == '' && '1' || '0' }}
        run: python social/tools/check.py

  # The tests, with the coverage report SonarQube Cloud reads (.coveragerc:
  # the code roots, relative paths, branches): brand's, then the social pack's
  # in a second pytest appended to the same data, since both import modules
  # named check and export from their own tools/. Then the pictures of both
  # drawn again within tolerance: exact pixels are the exporting machine's to
  # compare, since this runner's Chromium draws an edge a shade apart, so
  # gross drift (a shape out of place, a picture not redrawn) fails here. The
  # tree job holds the metadata to the private deny-list, so here identity is
  # only warned about (KLEIDOS_DENY_OPTIONAL). The same call runs mypy and
  # OSV.
  check:
    name: "🧪 Check"
    needs: [quick, tree]
    uses: kleidos-dev/.github/.github/workflows/check.yml@v3
    with:
      # -I: pip is the installed one, never a pip.py of the tree.
      install: python -I -m pip install --require-hashes -r requirements.txt
      tests: >-
        python -m playwright install --with-deps chromium
        && export KLEIDOS_DENY_OPTIONAL=1
        && python -m pytest -rs --cov --cov-report= tests
        && python -m pytest -rs --cov --cov-append --cov-report=xml:coverage.xml social/tests
        && python tools/build.py --check --tolerant
        && python social/tools/export.py --check --tolerant
      timeout-minutes: 45
    permissions:
      contents: read

  # The KiCad kit through the KiCad that boards and the meter export with
  # (10.0.8): the fixture on each ground, ERC clean, both exports written with
  # the theme found and one wire width, so a drawing sheet or a theme KiCad
  # cannot read never merges. The image is pinned by digest, its tag beside
  # it: the quality kit holds the pin to that form, and a newer KiCad release
  # is a note in its report, taken by hand together with boards and the meter
  # (Dependabot reads no workflow's container:).
  # The image's own Python is Debian's 3.13, older than the one the code is
  # written for, so the script runs on the Python .python-version names,
  # which uv (at the version requirements.txt pins) installs beside it, as
  # boards' schematic job does. Standard library only: nothing else installed.
  kicad:
    name: "🧫 KiCad kit (fixture exported on each ground)"
    needs: [quick, tree]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: kicad/kicad@sha256:3f4a01786dfbe803a65f345c3342b765db9add913f5e9448f8356793714ddc34 # 10.0.8
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The Python .python-version names, through uv as requirements.txt pins and hashes it
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3-pip
          # uv's pin with its hashes: the line and the --hash lines it continues.
          awk '/^uv==/ { p = 1 } p { print } p && !/\\$/ { p = 0 }' requirements.txt > "$RUNNER_TEMP/uv.txt"
          [[ $(grep -c '^uv==' "$RUNNER_TEMP/uv.txt") -eq 1 ]] || { echo "requirements.txt must pin uv"; exit 1; }
          python3 -m pip install --break-system-packages --root-user-action=ignore --require-hashes -r "$RUNNER_TEMP/uv.txt"
          # uv reads .python-version and downloads that Python when the image lacks it.
          uv venv --managed-python "$RUNNER_TEMP/python"
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
      - name: The script runs on that Python
        run: |
          set -euo pipefail
          want=$(grep -Ev '^[[:space:]]*(#|$)' .python-version | head -n 1)
          got=$(python3 -c 'import sys; print(f"{sys.version_info[0]}.{sys.version_info[1]}")')
          [[ "$got" == "$want" ]] || { echo "python3 is $got, .python-version names $want"; exit 1; }
      - name: The kit's fixture, exported on each ground
        run: python3 tools/check_kicad.py

  # The Python code (tools/, the KiCad helper and the tests) on SonarQube
  # Cloud: sonar-project.properties holds the project. Secretless (OIDC); a
  # pull request from a fork or Dependabot, which GitHub gives no OIDC token,
  # ends green with a notice. Last stage: it reads the coverage the tests
  # wrote.
  sonar:
    name: "📊 Sonar"
    needs: check
    if: github.event_name != 'schedule'
    uses: kleidos-dev/.github/.github/workflows/sonar.yml@v3
    permissions:
      contents: read
      id-token: write

  done:
    name: "✅ Check"
    needs: [quick, check, tree, kicad, sonar]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job of this file succeeded
        # -p: no BASH_ENV, no function and no option from the environment; and
        # both variables are always set here, so nothing outside the step steers it.
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        env:
          NEEDS: ${{ toJSON(needs) }}
          MAY_SKIP: kicad sonar
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin HOME=/nonexistent
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "${NEEDS}" | jq -e --arg may " ${MAY_SKIP} " '
            length > 0 and all(to_entries[];
              .value.result == "success"
              or (.value.result == "skipped" and (.key as $job | $may | contains(" \($job) "))))' > /dev/null || {
            echo "::error title=Not every job succeeded::a job that failed, was cancelled or was skipped without leave is listed above"
            exit 1
          }
