#
# The repository's gate on every push and pull request, cheapest first
# (the project's CI convention). Every shared check is a job of the Kleidos
# quality kit (kleidos-dev/.github, docs/quality.md), called at the kit
# commit .github/quality/SOURCE.json records; the kit's sync.py keeps the
# references there. What only this repository does (the tree's rules and
# the generated files, the pictures, the KiCad kit) is a job of its own.
#
#   🧹 Lint ──────────┬─ 🔎 Types ───────────────────────────────
#   ⚖️ Licensing ─────┼─ 🧪 Tests and pictures ── 📊 SonarCloud
#   🧭 Tree rules ────┼─ 🧫 KiCad kit
#                     ├─ 🛡️ Dependency vulnerabilities
#                     └─ 🔐 Secrets and MAC scan
#
# The weekly run is for OSV: a new advisory against unchanged dependencies
# turns it red. It skips the slow drawing jobs and SonarCloud.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Monday 06:00 Europe/Madrid in winter, with the Dependabot runs.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "🧹 Lint (quality kit)"
    uses: kleidos-dev/.github/.github/workflows/reusable-lint.yml@30f0dc69833e0917c7865eb93770237fedacff59 # quality-v2.0.0
    with:
      # brand-check runs tools/check.py from the local virtual environment;
      # the tree job below runs it with the pinned stack and the deny-list.
      skip: brand-check
    permissions:
      contents: read

  reuse:
    name: "⚖️ Licensing (REUSE)"
    uses: kleidos-dev/.github/.github/workflows/reusable-reuse.yml@30f0dc69833e0917c7865eb93770237fedacff59 # quality-v2.0.0
    permissions:
      contents: read

  # The tree's own rules (tools/check.py) and the generated files against
  # their sources, without a browser. The identity patterns of the metadata
  # check's deny-list are private: they come from the KLEIDOS_DENY_EXTRA
  # secret, one pattern per line. A run without it (a fork, Dependabot, or
  # the secret not set yet) checks every other class and warns that identity
  # was not checked.
  tree:
    name: "🧭 Tree rules and generated files"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install the pinned stack
        run: pip install -r requirements.txt
      - name: The tree's rules
        env:
          KLEIDOS_DENY_EXTRA: ${{ secrets.KLEIDOS_DENY_EXTRA }}
          KLEIDOS_DENY_OPTIONAL: ${{ secrets.KLEIDOS_DENY_EXTRA == '' && '1' || '0' }}
        run: python tools/check.py
      - name: Every generated file is what its sources give (no browser)
        env:
          KLEIDOS_DENY_EXTRA: ${{ secrets.KLEIDOS_DENY_EXTRA }}
          KLEIDOS_DENY_OPTIONAL: ${{ secrets.KLEIDOS_DENY_EXTRA == '' && '1' || '0' }}
        run: python tools/build.py --check --static

  types:
    name: "🔎 Types (mypy)"
    needs: [lint, reuse, tree]
    uses: kleidos-dev/.github/.github/workflows/reusable-mypy.yml@30f0dc69833e0917c7865eb93770237fedacff59 # quality-v2.0.0
    with:
      install: python -m pip install -r requirements.txt
    permissions:
      contents: read

  # The tests, with the coverage report SonarQube Cloud reads (.coveragerc:
  # the code roots, relative paths, branches), then the pictures drawn again
  # within tolerance: exact pixels are the exporting machine's to compare,
  # since this runner's Chromium draws an edge a shade apart, so gross drift
  # (a shape out of place, a picture not redrawn) fails here. The tree job
  # holds the metadata to the private deny-list, so here identity is only
  # warned about (KLEIDOS_DENY_OPTIONAL).
  tests:
    name: "🧪 Tests and pictures"
    needs: [lint, reuse, tree]
    if: github.event_name != 'schedule'
    uses: kleidos-dev/.github/.github/workflows/reusable-python-tests.yml@30f0dc69833e0917c7865eb93770237fedacff59 # quality-v2.0.0
    with:
      run: >-
        python -m playwright install --with-deps chromium
        && export KLEIDOS_DENY_OPTIONAL=1
        && python -m pytest -rs --cov --cov-report=xml:coverage.xml tests
        && python tools/build.py --check --tolerant
      timeout-minutes: 45
    permissions:
      contents: read

  # The KiCad kit through the KiCad that boards and the meter export with
  # (10.0.8): the fixture on each ground, ERC clean, both exports written with
  # the theme found and one wire width, so a drawing sheet or a theme KiCad
  # cannot read never merges. Standard library only: the image's own Python.
  kicad:
    name: "🧫 KiCad kit (fixture exported on each ground)"
    needs: [lint, reuse, tree]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: kicad/kicad:10.0.8
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The kit's fixture, exported on each ground
        run: python3 tools/check_kicad.py

  osv:
    name: "🛡️ Dependency vulnerabilities (OSV)"
    needs: [lint, reuse]
    uses: kleidos-dev/.github/.github/workflows/reusable-osv.yml@30f0dc69833e0917c7865eb93770237fedacff59 # quality-v2.0.0
    permissions:
      contents: read

  secrets:
    name: "🔐 Secrets and MAC scan (gitleaks)"
    needs: [lint, reuse]
    uses: kleidos-dev/.github/.github/workflows/reusable-secrets.yml@30f0dc69833e0917c7865eb93770237fedacff59 # quality-v2.0.0
    permissions:
      contents: read

  # The Python code (tools/, the KiCad helper and the tests) on SonarQube
  # Cloud: sonar-project.properties holds the project. Secretless (OIDC), on
  # every push to main and every pull request against main; a pull request
  # from a fork or Dependabot, which GitHub gives no OIDC token, ends green
  # with a notice. Last stage: it reads the coverage the tests job wrote.
  sonarcloud:
    name: "📊 SonarCloud"
    needs: [tests]
    if: github.event_name != 'schedule'
    uses: kleidos-dev/.github/.github/workflows/reusable-sonarcloud.yml@30f0dc69833e0917c7865eb93770237fedacff59 # quality-v2.0.0
    permissions:
      contents: read
      id-token: write
