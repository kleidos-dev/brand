#
# The commit-message gate: the first check on every pull request. The job
# is the Kleidos quality kit's reusable-commit-check.yml (kleidos-dev/.github,
# docs/quality.md), at the kit commit .github/quality/SOURCE.json records;
# the kit's sync.py keeps the reference below there. The comment on the pull
# request is posted by commit-check-comment.yml, which follows this workflow
# by its name.
name: Commit check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: commit-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: "✍️ Commit messages"
    uses: kleidos-dev/.github/.github/workflows/reusable-commit-check.yml@dd76a0850b26c2db6b5e56c884acaf40abb9e12c # quality-v2.1.0
    permissions:
      contents: read
