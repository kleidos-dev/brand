# SPDX-License-Identifier: MIT
#
# SonarQube Cloud project configuration for brand. The code here is the
# builder, the checks and their tests (Python); the rest of the tree is
# artwork, data and generated files, which are not code and are left out.
# Scanner reference:
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-parameters/

# --- Project identification ---
# One SonarQube Cloud organization per GitHub owner, its key the owner's login;
# each project's key is <organization>_<repository>, the form the import flow
# generates and every jmrplens project already uses (jmrplens_phonometry, ...).
sonar.organization=kleidos-dev
sonar.projectKey=kleidos-dev_brand
sonar.projectName=brand
# The GitHub repository's description, shown on the project's page.
sonar.projectDescription=The Kleidos logo, type, colors, design tokens and press kit

# --- Links ---
# The links on the project's page. They are not settable in the UI, so they
# live here: https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-parameters/
sonar.links.homepage=https://kleidos.dev
sonar.links.scm=https://github.com/kleidos-dev/brand
sonar.links.issue=https://github.com/kleidos-dev/brand/issues
sonar.links.ci=https://github.com/kleidos-dev/brand/actions

# --- Analysis ---
# CI analysis only, from the "📊 SonarCloud" job of .github/workflows/check.yml
# (secretless, on every push to main and every pull request against main):
# the scanner takes nothing from automatic configuration, every setting is in
# this file. Automatic Analysis is off in the project's settings.
sonar.scanner.autoconfig.enabled=false

# --- Layout ---
# The code roots, named explicitly so the artwork, the fonts, the tokens and
# the generated files never count as code: the tools/ package (the builders,
# the checks and the kleidos_brand package social imports) and the KiCad kit's
# helper, the one script outside it. The commit-message gate under .github/ is
# outside both roots, so it needs no exclusion here.
sonar.sources=tools,kicad/kleidos_kicad.py
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# --- Language ---
# The newest Python version SonarQube Cloud lists as supported; the CI runs
# the version in .python-version (3.15), so raise this when the docs list it.
sonar.python.version=3.14

# --- Coverage ---
# The Cobertura report the "Tests and pictures" job writes with relative
# paths (.coveragerc: relative_files = True, required on GitHub Actions) and
# hands to the SonarCloud job as the "coverage" artifact.
sonar.python.coverage.reportPaths=coverage.xml

# No sonar.issue.ignore.*, no coverage.exclusions and no cpd.exclusions to move
# a number: an issue is fixed with a real change or left open, and coverage is
# raised with tests (the Kleidos rule since 2026-07-12).
